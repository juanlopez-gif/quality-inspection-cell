</style><rect x="0" y="0" width="1300" height="900" fill="#ffffff"/><text x="20" y="34" class="title">Quality inspection cell - wiring and connections</text><rect x="520" y="60" width="260" height="150" rx="10" fill="#ffffff" stroke="#34495e" stroke-width="2.5"/><rect x="520" y="60" width="260" height="30" rx="10" fill="#34495e"/><rect x="520" y="80" width="260" height="10" fill="#34495e"/><text x="650.0" y="81" text-anchor="middle" class="t b" style="fill:#fff">PC  (Ubuntu 24.04 + ROS 2 Jazzy)</text><text x="532" y="112" class="s">runs all ROS 2 nodes</text><text x="532" y="130" class="s">supervisor, drivers, dashboard</text><text x="532" y="148" class="s">USB: Arduino, camera</text><text x="532" y="166" class="s">Ethernet: UR7e controller</text><rect x="80" y="300" width="280" height="200" rx="10" fill="#ffffff" stroke="#d08b3e" stroke-width="2.5"/><rect x="80" y="300" width="280" height="30" rx="10" fill="#d08b3e"/><rect x="80" y="320" width="280" height="10" fill="#d08b3e"/><text x="220.0" y="321" text-anchor="middle" class="t b" style="fill:#fff">Arduino Uno / Nano</text><text x="92" y="352" class="s">firmware: arduino/cell_io/cell_io.ino</text><text x="92" y="370" class="s">USB serial 115200 baud</text><text x="92" y="388" class="s">D2  &lt;- IR receiver OUT (pull-up)</text><text x="92" y="406" class="s">D7  -&gt; relay / MOSFET IN</text><text x="92" y="424" class="s">5V, GND -&gt; sensor + relay logic</text><text x="92" y="442" class="s">D13 LED = beam blocked</text><rect x="20" y="580" width="210" height="130" rx="10" fill="#ffffff" stroke="#e74c3c" stroke-width="2.5"/><rect x="20" y="580" width="210" height="30" rx="10" fill="#e74c3c"/><rect x="20" y="600" width="210" height="10" fill="#e74c3c"/><text x="125.0" y="601" text-anchor="middle" class="t b" style="fill:#fff">IR break-beam sensor</text><text x="32" y="632" class="s">emitter: 5V, GND</text><text x="32" y="650" class="s">receiver: 5V, GND, OUT</text><text x="32" y="668" class="s">beam across the belt at</text><text x="32" y="686" class="s">X = ir_sensor.x_mm</text><rect x="260" y="580" width="230" height="130" rx="10" fill="#ffffff" stroke="#8e44ad" stroke-width="2.5"/><rect x="260" y="580" width="230" height="30" rx="10" fill="#8e44ad"/><rect x="260" y="600" width="230" height="10" fill="#8e44ad"/><text x="375.0" y="601" text-anchor="middle" class="t b" style="fill:#fff">Relay module / MOSFET</text><text x="272" y="632" class="s">IN  &lt;- Arduino D7</text><text x="272" y="650" class="s">VCC 5V, GND (Arduino)</text><text x="272" y="668" class="s">contact COM/NO in series</text><text x="272" y="686" class="s">with the motor supply</text><rect x="260" y="750" width="230" height="90" rx="10" fill="#ffffff" stroke="#8e44ad" stroke-width="2.5"/><rect x="260" y="750" width="230" height="30" rx="10" fill="#8e44ad"/><rect x="260" y="770" width="230" height="10" fill="#8e44ad"/><text x="375.0" y="771" text-anchor="middle" class="t b" style="fill:#fff">Conveyor motor + PSU</text><text x="272" y="802" class="s">separate supply (e.g. 24 V DC)</text><text x="272" y="820" class="s">flyback diode if MOSFET</text><rect x="560" y="300" width="210" height="120" rx="10" fill="#ffffff" stroke="#d4a017" stroke-width="2.5"/><rect x="560" y="300" width="210" height="30" rx="10" fill="#d4a017"/><rect x="560" y="320" width="210" height="10" fill="#d4a017"/><text x="665.0" y="321" text-anchor="middle" class="t b" style="fill:#fff">USB camera</text><text x="572" y="352" class="s">above the belt, looking down</text><text x="572" y="370" class="s">source: 0 (/dev/video0)</text><text x="572" y="388" class="s">fixed mount, diffuse light</text><rect x="880" y="60" width="330" height="200" rx="10" fill="#ffffff" stroke="#1fb5a8" stroke-width="2.5"/><rect x="880" y="60" width="330" height="30" rx="10" fill="#1fb5a8"/><rect x="880" y="80" width="330" height="10" fill="#1fb5a8"/><text x="1045.0" y="81" text-anchor="middle" class="t b" style="fill:#fff">UR7e control box</text><text x="892" y="112" class="s">Ethernet &lt;-&gt; PC (static IP)</text><text x="892" y="130" class="s">Remote Control mode ON</text><text x="892" y="148" class="s">DO0 (standard, 24 V) -&gt; vacuum</text><text x="892" y="166" class="s">   valve / pump relay</text><text x="892" y="184" class="s">E-stop on teach pendant</text><text x="892" y="202" class="s">(+ optional external E-stop)</text><rect x="880" y="330" width="330" height="150" rx="10" fill="#ffffff" stroke="#1fb5a8" stroke-width="2.5"/><rect x="880" y="330" width="330" height="30" rx="10" fill="#1fb5a8"/><rect x="880" y="350" width="330" height="10" fill="#1fb5a8"/><text x="1045.0" y="351" text-anchor="middle" class="t b" style="fill:#fff">UR7e arm + suction cup</text><text x="892" y="382" class="s">TCP = tip of the suction cup</text><text x="892" y="400" class="s">payload = cup + piece</text><text x="892" y="418" class="s">vacuum hose from ejector to cup</text><rect x="880" y="560" width="330" height="160" rx="10" fill="#ffffff" stroke="#2e86de" stroke-width="2.5"/><rect x="880" y="560" width="330" height="30" rx="10" fill="#2e86de"/><rect x="880" y="580" width="330" height="10" fill="#2e86de"/><text x="1045.0" y="581" text-anchor="middle" class="t b" style="fill:#fff">Vacuum generation</text><text x="892" y="612" class="s">A) 24 V solenoid valve + venturi</text><text x="892" y="630" class="s">    ejector + compressed air</text><text x="892" y="648" class="s">B) 24 V vacuum pump (via relay)</text><text x="892" y="666" class="s">driven by UR DO0 (robot.vacuum_output)</text><path d="M520,150 L220,150 L220,300" class="wire" stroke="#34495e" /><text x="230" y="140" class="xs b" style="fill:#34495e">USB (serial /dev/ttyACM0)</text><path d="M650,210 L650,300" class="wire" stroke="#34495e" /><text x="660" y="260" class="xs b" style="fill:#34495e">USB (video)</text><path d="M780,130 L880,130" class="wire" stroke="#34495e" /><text x="795" y="120" class="xs b" style="fill:#34495e">Ethernet</text><path d="M150,500 L150,580" class="wire" stroke="#e74c3c" /><text x="158" y="545" class="xs b" style="fill:#e74c3c">D2 / 5V / GND</text><path d="M300,500 L300,580" class="wire" stroke="#8e44ad" /><text x="308" y="545" class="xs b" style="fill:#8e44ad">D7 / 5V / GND</text><path d="M375,710 L375,750" class="wire" stroke="#8e44ad" /><text x="383" y="735" class="xs b" style="fill:#8e44ad">COM / NO</text><path d="M1045,260 L1045,330" class="wire" stroke="#1fb5a8" /><text x="1053" y="300" class="xs b" style="fill:#1fb5a8">arm cable</text><path d="M1210,200 L1260,200 L1260,640 L1210,640" class="wire" stroke="#2e86de" /><text x="1140" y="525" class="xs b" style="fill:#2e86de">DO0 24 V + 0 V</text><path d="M880,640 L840,640 L840,420 L880,420" class="wire" stroke="#2e86de" stroke-dasharray="8 5"/><text x="770" y="540" class="xs b" style="fill:#2e86de">vacuum hose</text><rect x="520" y="560" width="300" height="190" rx="10" fill="#fff6f5" stroke="#c0392b" stroke-width="2"/><text x="535" y="588" class="s b" style="fill:#922b21">SAFETY NOTES</text><text x="535" y="610" class="s" style="fill:#922b21">Common GND: Arduino + relay logic only.</text><text x="535" y="632" class="s" style="fill:#922b21">Never power the motor from the Arduino.</text><text x="535" y="654" class="s" style="fill:#922b21">Check UR DO current limits in the manual;</text><text x="535" y="676" class="s" style="fill:#922b21">use a relay for a pump.</text><text x="535" y="698" class="s" style="fill:#922b21">E-stop within reach at all times.</text><text x="535" y="720" class="s" style="fill:#922b21">Test the robot at low speed first.</text><text x="20" y="885" class="xs">Generated by tools/make_build_figures.py. Pins and outputs are the defaults of cell_io.ino and cell_config.yaml.</text></svg>